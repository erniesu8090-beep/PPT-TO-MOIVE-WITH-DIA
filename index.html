      { text: "並藉由重油觸媒裂解技術實現價值的極致轉換。", start: 14.11, end: 18.6, speaker: "A", speaker_name: "主持人 A" },
      { text: "我們在安全、", start: 18.6, end: 19.87, speaker: "A", speaker_name: "主持人 A" },
      { text: "環保與高效率的調度原則下，", start: 19.87, end: 22.62, speaker: "A", speaker_name: "主持人 A" },
      { text: "實現了價值榨取最大化與環保品質極致化。", start: 22.62, end: 26.65, speaker: "A", speaker_name: "主持人 A" },
      { text: "這座龐大的煉製系統，", start: 26.65, end: 28.61, speaker: "A", speaker_name: "主持人 A" },
      { text: "將繼續精準且穩定地驅動著台灣的工業命脈與經濟未來。", start: 28.61, end: 33.52, speaker: "A", speaker_name: "主持人 A" },
      { text: "謝謝大家。", start: 33.52, end: 35.17, speaker: "A", speaker_name: "主持人 A" }
    ]
  }
];
const DUAL_CONFIG = {"mode": "single", "speaker_a": {"name": "主持人 A", "color": "#40a9ff", "voice": "zh-TW-YunJheNeural", "rate": "0%", "pitch": "-5Hz"}, "speaker_b": {"name": "專家 B", "color": "#fadb14", "voice": "zh-TW-HsiaoChenNeural", "rate": "+5%", "pitch": "-2Hz"}, "voice": "zh-CN-YunxiNeural", "rate": "0%", "pitch": "0Hz", "pad_time": 0.5};
const EMBED_SUBTITLES = true;

const TOTAL_DUR = PAGES.reduce((sum, p) => sum + p.dur, 0);
const stage = document.getElementById('stage');

// 動態生成 Slide HTML
PAGES.forEach(p => {
  const slideEl = document.createElement('div');
  slideEl.className = 'slide';
  slideEl.dataset.page = p.i;
  slideEl.style.setProperty('--dur', p.dur + 's');
  slideEl.innerHTML = `
    <div class="img" style="background-image:url('assets/images/page-${String(p.i).padStart(2, '0')}.png')"></div>
    <div class="vignette"></div>
    <div class="chapter"><span class="num">${String(p.i).padStart(2, '0')}</span> / ${PAGES.length} — ${p.title}</div>
    <div class="version-badge"><span class="version-dot"></span><span class="version-text">SLIDE EDITION v2.4.0 (2026/07/25)</span></div>
  `;
  stage.appendChild(slideEl);
});

// 建立共用字幕條
const subtitleEl = document.createElement('div');
subtitleEl.className = 'subtitle';
subtitleEl.id = 'subtitle';
stage.appendChild(subtitleEl);

const slideEls = [...document.querySelectorAll('.slide')];
const audio = document.getElementById('audio');
const progress = document.getElementById('progress');
const startScreen = document.getElementById('startScreen');
const sub = document.getElementById('subtitle');
const dialogueStage = document.getElementById('dialogueStage');
const speakerCardA = document.getElementById('speakerCardA');
const speakerCardB = document.getElementById('speakerCardB');

let currentSlide = 0;
let totalElapsed = 0;
let slideStartTime = 0;
let rafId = null;

const urlParams = new URLSearchParams(window.location.search);
const isRenderMode = urlParams.get('render') === 'true';

function showSlide(i) {
  slideEls.forEach((el, idx) => el.classList.toggle('active', idx === i));
  const p = PAGES[i];
  
  sub.innerHTML = "";
  sub.classList.remove('show');
  if (speakerCardA && speakerCardB) {
    speakerCardA.classList.remove('speaking');
    speakerCardB.classList.remove('speaking');
  }

  if (!isRenderMode) {
    audio.src = `assets/narration/page-${String(p.i).padStart(2, '0')}.mp3`;
    audio.play().catch(()=>{});
  }

  slideStartTime = performance.now();
}

function tick() {
  const now = performance.now();
  const elapsed = (now - slideStartTime) / 1000;
  const p = PAGES[currentSlide];
  const slideDur = p.dur;

  const totalProgress = (totalElapsed + elapsed) / TOTAL_DUR;
  progress.style.width = (Math.min(totalProgress, 1) * 100) + '%';

  const activeClause = p.clauses.find(c => elapsed >= c.start && elapsed < c.end);
  if (activeClause) {
    if (sub.dataset.text !== activeClause.text) {
      sub.dataset.text = activeClause.text;
      if (DUAL_CONFIG.mode === "dual" || (activeClause.speaker && activeClause.speaker !== 'A')) {
        const isB = activeClause.speaker === "B";
        const spkColor = isB ? (DUAL_CONFIG.speaker_b ? DUAL_CONFIG.speaker_b.color : '#fadb14') : (DUAL_CONFIG.speaker_a ? DUAL_CONFIG.speaker_a.color : '#40a9ff');
        
        sub.innerHTML = `<span style="color:${spkColor}; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 2px 8px rgba(0,0,0,0.9);">${activeClause.text}</span>`;
      } else {
        sub.innerHTML = activeClause.text;
      }
      sub.classList.add('show');
    }
  } else {
    sub.innerHTML = "";
    sub.classList.remove('show');
    sub.dataset.text = "";
    if (speakerCardA && speakerCardB) {
      speakerCardA.classList.remove('speaking');
      speakerCardB.classList.remove('speaking');
    }
  }

  if (elapsed >= slideDur) {
    totalElapsed += slideDur;
    currentSlide++;
    if (currentSlide >= PAGES.length) {
      cancelAnimationFrame(rafId);
      sub.classList.remove('show');
      console.log('Playback complete');
      return;
    }
    showSlide(currentSlide);
  }
  rafId = requestAnimationFrame(tick);
}

startScreen.addEventListener('click', () => {
  startScreen.classList.add('hidden');
  showSlide(0);
  rafId = requestAnimationFrame(tick);
});

if (isRenderMode) {
  if (!EMBED_SUBTITLES) {
    document.body.classList.add('render-no-embed');
  }
  startScreen.classList.add('hidden');
  showSlide(0);
  rafId = requestAnimationFrame(tick);
}
</script>

</body>
</html>
