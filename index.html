      { text: "一點也沒錯。", start: 31.18, end: 32.43, speaker: "B", speaker_name: "專家 B" },
      { text: "這張表就是知識時代最穩固的基石，", start: 32.43, end: 35.76, speaker: "B", speaker_name: "專家 B" },
      { text: "幫助我們從內在修煉，", start: 35.76, end: 37.83, speaker: "B", speaker_name: "專家 B" },
      { text: "一路延伸到外在的卓越管理與服務。", start: 37.83, end: 41.16, speaker: "B", speaker_name: "專家 B" }
    ]
  },
  {
    i: 15,
    dur: 42,
    title: "邁向卓越之路",
    audio_dur: 40.85,
    clauses: [
      { text: "終於來到最後一頁邁向卓越之路。", start: 0.0, end: 3.19, speaker: "A", speaker_name: "主持人 A" },
      { text: "這裡有一句話很觸動我，", start: 3.19, end: 5.53, speaker: "A", speaker_name: "主持人 A" },
      { text: "聰明是一種天賦，", start: 5.53, end: 7.23, speaker: "A", speaker_name: "主持人 A" },
      { text: "而善良是一種選擇。", start: 7.23, end: 9.15, speaker: "A", speaker_name: "主持人 A" },
      { text: "這句話充滿智慧與包容。", start: 9.15, end: 11.49, speaker: "B", speaker_name: "專家 B" },
      { text: "無論我們在通往平庸的路上走了多遠，", start: 11.49, end: 15.11, speaker: "B", speaker_name: "專家 B" },
      { text: "只要願意，", start: 15.11, end: 16.17, speaker: "B", speaker_name: "專家 B" },
      { text: "我們永遠可以選擇轉換跑道，", start: 16.17, end: 18.93, speaker: "B", speaker_name: "專家 B" },
      { text: "永遠不嫌晚。", start: 18.93, end: 20.21, speaker: "B", speaker_name: "專家 B" },
      { text: "簡報最後提醒大家要從影響圈開始改變，", start: 20.21, end: 24.04, speaker: "A", speaker_name: "主持人 A" },
      { text: "尋找心聲交集，", start: 24.04, end: 25.53, speaker: "A", speaker_name: "主持人 A" },
      { text: "並且期許自己做一個燈塔而非一個法官。", start: 25.53, end: 29.36, speaker: "A", speaker_name: "主持人 A" },
      { text: "是的。", start: 29.36, end: 30.0, speaker: "B", speaker_name: "專家 B" },
      { text: "停止把人當作物品。", start: 30.0, end: 31.91, speaker: "B", speaker_name: "專家 B" },
      { text: "讓我們一起用溫暖的光芒照亮他人，", start: 31.91, end: 35.32, speaker: "B", speaker_name: "專家 B" },
      { text: "而非用嚴厲的眼光批判世界，", start: 35.32, end: 38.08, speaker: "B", speaker_name: "專家 B" },
      { text: "這就是卓越人生最美的實踐。", start: 38.08, end: 40.85, speaker: "B", speaker_name: "專家 B" }
    ]
  }
];
const DUAL_CONFIG = {"mode": "dual", "speaker_a": {"name": "主持人 A", "color": "#06b6d4", "voice": "zh-TW-YunJheNeural", "rate": "0%", "pitch": "0Hz"}, "speaker_b": {"name": "專家 B", "color": "#8b5cf6", "voice": "zh-TW-HsiaoChenNeural", "rate": "+5%", "pitch": "-2Hz"}, "voice": "zh-TW-YunJheNeural", "rate": "-5%", "pitch": "-2Hz", "pad_time": 0.5};
const EMBED_SUBTITLES = true;

const TOTAL_DUR = PAGES.reduce((sum, p) => sum + p.dur, 0);
const stage = document.getElementById('stage');

// 動態生成 Slide HTML
PAGES.forEach(p => {
  const slideEl = document.createElement('div');
  slideEl.className = 'slide';
  slideEl.dataset.page = p.i;
  slideEl.style.setProperty('--dur', p.dur + 's');
  slideEl.innerHTML = `
    <div class="img" style="background-image:url('assets/images/page-${String(p.i).padStart(2, '0')}.png')"></div>
    <div class="vignette"></div>
    <div class="chapter"><span class="num">${String(p.i).padStart(2, '0')}</span> / ${PAGES.length} — ${p.title}</div>
    <div class="version-badge"><span class="version-dot"></span><span class="version-text">SLIDE EDITION v2.4.0 (2026/07/25)</span></div>
  `;
  stage.appendChild(slideEl);
});

// 建立共用字幕條
const subtitleEl = document.createElement('div');
subtitleEl.className = 'subtitle';
subtitleEl.id = 'subtitle';
stage.appendChild(subtitleEl);

const slideEls = [...document.querySelectorAll('.slide')];
const audio = document.getElementById('audio');
const progress = document.getElementById('progress');
const startScreen = document.getElementById('startScreen');
const sub = document.getElementById('subtitle');
const dialogueStage = document.getElementById('dialogueStage');
const speakerCardA = document.getElementById('speakerCardA');
const speakerCardB = document.getElementById('speakerCardB');

let currentSlide = 0;
let totalElapsed = 0;
let slideStartTime = 0;
let rafId = null;

const urlParams = new URLSearchParams(window.location.search);
const isRenderMode = urlParams.get('render') === 'true';

function showSlide(i) {
  slideEls.forEach((el, idx) => el.classList.toggle('active', idx === i));
  const p = PAGES[i];
  
  sub.innerHTML = "";
  sub.classList.remove('show');
  if (speakerCardA && speakerCardB) {
    speakerCardA.classList.remove('speaking');
    speakerCardB.classList.remove('speaking');
  }

  if (!isRenderMode) {
    audio.src = `assets/narration/page-${String(p.i).padStart(2, '0')}.mp3`;
    audio.play().catch(()=>{});
  }

  slideStartTime = performance.now();
}

function tick() {
  const now = performance.now();
  const elapsed = (now - slideStartTime) / 1000;
  const p = PAGES[currentSlide];
  const slideDur = p.dur;

  const totalProgress = (totalElapsed + elapsed) / TOTAL_DUR;
  progress.style.width = (Math.min(totalProgress, 1) * 100) + '%';

  const activeClause = p.clauses.find(c => elapsed >= c.start && elapsed < c.end);
  if (activeClause) {
    if (sub.dataset.text !== activeClause.text) {
      sub.dataset.text = activeClause.text;
      if (DUAL_CONFIG.mode === "dual" || (activeClause.speaker && activeClause.speaker !== 'A')) {
        const isB = activeClause.speaker === "B";
        const spkColor = isB ? (DUAL_CONFIG.speaker_b ? DUAL_CONFIG.speaker_b.color : '#8b5cf6') : (DUAL_CONFIG.speaker_a ? DUAL_CONFIG.speaker_a.color : '#06b6d4');
        
        sub.innerHTML = `<span style="color:${spkColor}; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 2px 8px rgba(0,0,0,0.9);">${activeClause.text}</span>`;
      } else {
        sub.innerHTML = activeClause.text;
      }
      sub.classList.add('show');
    }
  } else {
    sub.innerHTML = "";
    sub.classList.remove('show');
    sub.dataset.text = "";
    if (speakerCardA && speakerCardB) {
      speakerCardA.classList.remove('speaking');
      speakerCardB.classList.remove('speaking');
    }
  }

  if (elapsed >= slideDur) {
    totalElapsed += slideDur;
    currentSlide++;
    if (currentSlide >= PAGES.length) {
      cancelAnimationFrame(rafId);
      sub.classList.remove('show');
      console.log('Playback complete');
      return;
    }
    showSlide(currentSlide);
  }
  rafId = requestAnimationFrame(tick);
}

startScreen.addEventListener('click', () => {
  startScreen.classList.add('hidden');
  showSlide(0);
  rafId = requestAnimationFrame(tick);
});

if (isRenderMode) {
  if (!EMBED_SUBTITLES) {
    document.body.classList.add('render-no-embed');
  }
  startScreen.classList.add('hidden');
  showSlide(0);
  rafId = requestAnimationFrame(tick);
}
</script>
