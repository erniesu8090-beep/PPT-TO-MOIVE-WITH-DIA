<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Podcast Virtual Studio Stage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #070a12;
      color: #ffffff;
      position: relative;
    }

    /* 背景層：虛擬錄音室微暗深焦 */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background: url('../default_assets/studio_bg.jpg') center center / cover no-repeat;
      filter: brightness(0.38) blur(4px);
    }
    .bg-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background: radial-gradient(circle at 50% 45%, rgba(15, 23, 42, 0.2) 0%, rgba(5, 8, 15, 0.9) 100%);
    }

    /* 頂部標題 Bar */
    .header-bar {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .podcast-badge {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      padding: 5px 14px;
      border-radius: 100px;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .podcast-title {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }
    .topic-pill {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 18px;
      border-radius: 12px;
      font-size: 16px;
      color: #94a3b8;
    }
    .topic-pill span {
      color: #38bdf8;
      font-weight: 600;
    }

    /* 中央核心概念插圖螢幕 (Hero Display) */
    .center-screen-wrapper {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      width: 1200px;
      height: 675px;
      background: #0f172a;
      border-radius: 28px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.1);
      overflow: hidden;
      z-index: 5;
    }
    .concept-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .screen-tag {
      position: absolute;
      bottom: 20px;
      left: 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      padding: 8px 22px;
      font-size: 17px;
      font-weight: 600;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    .screen-tag .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }

    /* 兩側下方主持人卡片 (Anchors) */
    .host-card {
      position: absolute;
      bottom: 30px;
      width: 320px;
      height: 350px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      z-index: 8;
    }
    .card-left {
      left: 60px;
    }
    .card-right {
      right: 60px;
    }

    .avatar-frame {
      width: 292px;
      height: 270px;
      border-radius: 18px;
      overflow: hidden;
      background: #1e293b;
    }
    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
    /* 讓右側來賓微傾看向中央 */
    .card-right .avatar-frame img {
      transform: scaleX(-1);
    }

    .host-label {
      margin-top: 10px;
      font-size: 19px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .host-tag {
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }

    /* 底部中央字幕安全底框 */
    .subtitles-dock {
      position: absolute;
      bottom: 24px;
      left: 410px;
      width: 1100px;
      height: 120px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0) 0%, rgba(7, 10, 19, 0.8) 100%);
      border-radius: 20px;
      z-index: 6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-vignette"></div>

  <!-- 頂部資訊 Bar -->
  <div class="header-bar">
    <div class="header-left">
      <div class="podcast-badge">PODCAST 漫談</div>
      <div id="podcast-title" class="podcast-title">雙人深度對談</div>
    </div>
    <div class="topic-pill">
      當前解析：<span id="topic-text">核心議題</span>
    </div>
  </div>

  <!-- 中央核心概念插圖螢幕 -->
  <div class="center-screen-wrapper">
    <img id="concept-display" class="concept-img" src="" alt="Concept Screen">
    <div class="screen-tag">
      <div class="dot"></div>
      <span id="concept-caption">概念可視化</span>
    </div>
  </div>

  <!-- 左側下方：主持人 Alan -->
  <div class="host-card card-left">
    <div class="avatar-frame">
      <img src="../default_assets/host_alan.jpg" alt="Host Alan">
    </div>
    <div class="host-label">
      <span>主持人 Alan</span>
      <span class="host-tag">導遊</span>
    </div>
  </div>

  <!-- 右側下方：嘉賓 Beth (微側朝向中間) -->
  <div class="host-card card-right">
    <div class="avatar-frame">
      <img src="../default_assets/guest_beth.jpg" alt="Guest Beth">
    </div>
    <div class="host-label">
      <span>嘉賓 Beth</span>
      <span class="host-tag">分析者</span>
    </div>
  </div>

  <div class="subtitles-dock"></div>
</body>
</html>
